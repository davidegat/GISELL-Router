<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title></title>
<style>
:root{color-scheme:dark;--bg:#111318;--panel:#191c23;--panel2:#222631;--text:#eef1f7;--muted:#9ba4b5;--border:#343a48;--accent:#7aa2f7;--ok:#73daca;--bad:#f7768e;--warn:#e0af68}
*{box-sizing:border-box} body{margin:0;font:15px system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text)}
main{max-width:1050px;margin:0 auto;padding:28px 18px 60px}.top{display:flex;gap:16px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}.title h1{font-size:25px;margin:0 0 5px}.muted{color:var(--muted)}
.top-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.api{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px 14px;min-width:min(100%,390px)}.api code{color:var(--ok);word-break:break-all}
button,input,select{font:inherit}button{cursor:pointer;border:1px solid var(--border);background:var(--panel2);color:var(--text);border-radius:8px;padding:8px 11px}button:hover{border-color:var(--accent)}button.primary{background:var(--accent);color:#10131a;border-color:var(--accent);font-weight:650}button.danger{color:var(--bad)}button.small{padding:5px 8px;font-size:13px}
section{margin-top:26px}.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:11px}.sectionhead h2{font-size:18px;margin:0}.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:15px;margin:10px 0}.provider-head{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}.provider-name{font-weight:700}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.models{margin-top:12px;border-top:1px solid var(--border);padding-top:10px}.model{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:8px 0}.model+.model{border-top:1px dashed #2e3440}[hidden]{display:none!important}.tag{display:inline-block;border:1px solid var(--border);border-radius:999px;padding:2px 7px;color:var(--muted);font-size:12px}.tag.ok{color:var(--ok);border-color:#3a665f}.tag.bad{color:var(--bad);border-color:#6b3945}.tag.active{color:var(--accent);border-color:#435d91}.tag.off{opacity:.55}.route{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:10px 5px}.route+.route{border-top:1px solid var(--border)}.prio{color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}.route-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.flash{margin-top:14px;min-height:22px}.flash.ok{color:var(--ok)}.flash.bad{color:var(--bad)}
code.mid{color:var(--warn);font-size:12.5px;word-break:break-all}
.live{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-top:18px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.live.busy{border-color:var(--accent)}
.dot{width:11px;height:11px;border-radius:50%;background:var(--muted);flex:none}
.dot.busy{background:var(--accent);animation:pulse 1s infinite}
.dot.idle{background:#3f4757}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.8)}}
.live-main{flex:1;min-width:240px}.live-model{font-weight:700;font-size:16px}
.live-sub{color:var(--muted);font-size:13px;margin-top:3px}
.stat{font-size:12px;color:var(--muted);margin-top:3px;font-variant-numeric:tabular-nums}
.switch{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.switch input{width:16px;height:16px;accent-color:var(--accent)}
dialog{width:min(620px,calc(100% - 28px));border:1px solid var(--border);border-radius:14px;background:var(--panel);color:var(--text);padding:20px}dialog::backdrop{background:#000a}dialog h3{margin-top:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field input,.field select{width:100%;background:#11141a;border:1px solid var(--border);color:var(--text);border-radius:8px;padding:9px}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.empty{color:var(--muted);padding:18px 4px}.discover{max-height:260px;overflow:auto;border:1px solid var(--border);border-radius:8px;margin-top:10px}.discover button{display:block;width:100%;text-align:left;border:0;border-radius:0;background:transparent}.discover button:hover{background:var(--panel2)}
.tabs{display:flex;gap:8px;margin-top:22px;border-bottom:1px solid var(--border);padding:0 2px}.tab-btn{border:0;border-bottom:3px solid transparent;border-radius:8px 8px 0 0;background:transparent;padding:11px 16px;color:var(--muted);font-weight:700}.tab-btn:hover{color:var(--text);border-color:var(--border)}.tab-btn.active{color:var(--text);border-bottom-color:var(--accent);background:linear-gradient(180deg,transparent,#7aa2f70d)}
.tab-panel{display:none}.tab-panel.active{display:block}.log-toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:18px 0 10px}.log-window{height:min(64vh,680px);overflow:auto;background:#0d0f14;border:1px solid var(--border);border-radius:12px;padding:8px;font:12px ui-monospace,SFMono-Regular,Consolas,monospace}.log-empty{padding:26px;color:var(--muted);text-align:center}.log-row{display:grid;grid-template-columns:78px 72px minmax(150px,260px) 1fr;gap:9px;padding:8px 7px;border-bottom:1px solid #252a34;align-items:start}.log-row:last-child{border-bottom:0}.log-time{color:var(--muted);font-variant-numeric:tabular-nums}.log-level{font-weight:800;text-transform:uppercase}.log-level.error{color:var(--bad)}.log-level.success{color:var(--ok)}.log-level.info{color:var(--accent)}.log-source{color:#c0caf5;overflow:hidden;text-overflow:ellipsis}.log-message{white-space:pre-wrap;overflow-wrap:anywhere}.log-detail{display:block;color:#c7cbd4;margin-top:4px;white-space:pre-wrap;overflow-wrap:anywhere}.status-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:18px}.status-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:13px 14px;min-width:0}.status-label{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.05em}.status-value{font-size:18px;font-weight:750;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.status-detail{color:var(--muted);font-size:12px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.status-value.ok{color:var(--ok)}.status-value.warn{color:var(--warn)}
.preset-row{background:#202a42;box-shadow:inset 4px 0 0 var(--accent);border-radius:8px}.preset-members{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap}.chip{border:1px solid var(--border);border-radius:999px;padding:2px 9px;font-size:12px;color:var(--muted)}.chip.off{opacity:.45;text-decoration:line-through}.picker{max-height:230px;overflow:auto;border:1px solid var(--border);border-radius:8px}.picker .prow{display:flex;align-items:center;gap:6px;padding:6px 8px;border-bottom:1px solid #252a34}.picker .prow:last-child{border-bottom:0}.picker .pname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.picker .empty{padding:14px;font-size:13px}
.panel-intro{color:var(--muted);margin-top:8px}.config-model-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.api-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.api-box{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px}.api-box h3{margin:0 0 8px;font-size:16px}.codebox{display:flex;align-items:center;gap:8px;background:#11141a;border:1px solid var(--border);border-radius:8px;padding:10px 11px;margin-top:8px}.codebox code{color:var(--ok);word-break:break-all;flex:1}.key-value{color:var(--warn)!important}.instructions{line-height:1.55}.instructions ol{padding-left:22px}.instructions li+li{margin-top:5px}pre{white-space:pre-wrap;word-break:break-word;background:#11141a;border:1px solid var(--border);border-radius:8px;padding:12px;color:var(--text);overflow:auto}.auth-on{color:var(--ok);font-weight:700}.auth-off{color:var(--muted);font-weight:700}.footer{margin-top:34px;padding-top:16px;border-top:1px solid var(--border);color:var(--muted);font-size:13px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.service-state{font-weight:700;margin-bottom:8px}
@media(max-width:800px){.status-grid{grid-template-columns:1fr 1fr}.api-grid{grid-template-columns:1fr}}
@media(max-width:650px){.grid{grid-template-columns:1fr}.field.full{grid-column:auto}.model{grid-template-columns:1fr}.route{grid-template-columns:34px 1fr}.route-actions{grid-column:1/-1;justify-content:flex-start}.status-grid{grid-template-columns:1fr}.tabs{position:sticky;top:0;z-index:5;background:var(--bg);padding-top:6px}.tab-btn{flex:1}}
</style>
</head>
<body><main>
<div class="top"><div class="title"><h1 data-i18n="welcome"></h1><div class="muted" data-i18n="tagline"></div></div><div class="top-tools"><button class="small" id="langBtn"></button><div class="api"><div class="muted" data-i18n="api.local"></div><code id="apiUrl">...</code> <button class="small" id="copyApi" data-i18n="common.copy"></button></div></div></div>
<div class="tabs" role="tablist" data-i18n-aria-label="tabs.aria"><button class="tab-btn active" id="tabModelsBtn" data-tab="modelsTab" role="tab" aria-selected="true" data-i18n="tabs.models"></button><button class="tab-btn" id="tabConfigBtn" data-tab="configTab" role="tab" aria-selected="false" data-i18n="tabs.config"></button><button class="tab-btn" id="tabApiBtn" data-tab="apiTab" role="tab" aria-selected="false" data-i18n="tabs.api"></button><button class="tab-btn" id="tabLogsBtn" data-tab="logsTab" role="tab" aria-selected="false" data-i18n="tabs.log"></button></div>
<div id="flash" class="flash"></div>

<div class="tab-panel active" id="modelsTab" role="tabpanel" aria-labelledby="tabModelsBtn">
 <div class="live" id="live"><span class="dot idle" id="liveDot"></span><div class="live-main"><div class="live-model" id="liveModel" data-i18n="live.waiting"></div><div class="live-sub" id="liveSub" data-i18n="live.none_received"></div></div><label class="switch" data-i18n-title="live.force_active_title"><input type="checkbox" id="overrideChk"> <span data-i18n="live.force_active"></span></label></div>
 <div class="status-grid" id="statusGrid">
  <div class="status-card"><div class="status-label" data-i18n="status.router"></div><div class="status-value ok" id="statusRouter" data-i18n="status.online"></div><div class="status-detail" id="statusUptime">—</div></div>
  <div class="status-card"><div class="status-label" data-i18n="status.active_model"></div><div class="status-value" id="statusActive">—</div><div class="status-detail" id="statusActiveProvider">—</div></div>
  <div class="status-card"><div class="status-label" data-i18n="status.models"></div><div class="status-value" id="statusModels">0</div><div class="status-detail" id="statusModelsDetail">—</div></div>
  <div class="status-card"><div class="status-label" data-i18n="status.session_requests"></div><div class="status-value" id="statusRequests">0</div><div class="status-detail" id="statusErrors">—</div></div>
 </div>
 <section><div class="sectionhead"><h2 data-i18n="routes.order_title"></h2><div class="row"><span class="muted" data-i18n="routes.priority"></span><button id="testAllBtn" data-i18n="common.test_all"></button></div></div><div class="card" id="routes"></div></section>
</div>

<div class="tab-panel" id="configTab" role="tabpanel" aria-labelledby="tabConfigBtn">
 <div class="panel-intro" data-i18n="config.intro"></div>
 <section><div class="sectionhead"><h2 data-i18n="providers.title"></h2><button class="primary" id="addProviderBtn" data-i18n="providers.add"></button></div><div id="providers"></div></section>
 <section><div class="sectionhead"><h2 data-i18n="presets.title"></h2><button class="primary" id="addPresetBtn" data-i18n="presets.add"></button></div><div class="muted" style="margin-bottom:4px" data-i18n="presets.explanation"></div><div id="presets"></div></section>
 <section><div class="sectionhead"><h2 data-i18n="service.title"></h2></div><div class="api-box"><div class="service-state" id="serviceState" data-i18n="service.checking"></div><div class="muted" id="serviceDetail" data-i18n="service.description"></div><div class="row" style="margin-top:14px"><button class="primary" id="installServiceBtn" data-i18n="service.install"></button><button class="danger" id="removeServiceBtn" data-i18n="service.remove"></button><button id="lingerBtn" data-i18n="service.enable_boot"></button></div></div></section>
</div>

<div class="tab-panel" id="apiTab" role="tabpanel" aria-labelledby="tabApiBtn">
 <div class="panel-intro" data-i18n="api.intro"></div>
 <section><div class="api-grid">
  <div class="api-box instructions"><h3 data-i18n="api.connect_title"></h3><ol><li data-i18n-html="api.step_base"></li><li data-i18n-html="api.step_router"></li><li id="authInstruction" data-i18n="api.step_no_key"></li></ol><div class="muted" data-i18n="api.base_url"></div><div class="codebox"><code id="apiBaseUrl">...</code><button class="small" id="copyApiBase" data-i18n="common.copy"></button></div><div class="muted" style="margin-top:14px" data-i18n="api.curl_example"></div><pre id="curlExample"></pre><div class="muted" style="margin-top:14px" data-i18n="api.python_example"></div><pre id="pythonExample"></pre></div>
  <div class="api-box"><h3 data-i18n="api.key_title"></h3><div id="routerKeyStatus" class="auth-off"></div><div class="muted" style="margin-top:7px" data-i18n-html="api.key_description"></div><div class="row" style="margin-top:14px"><button class="primary" id="createRouterKey"></button><button class="danger" id="deleteRouterKey" data-i18n="api.remove_key"></button></div><div id="newKeyArea" hidden style="margin-top:16px"><div class="muted" data-i18n="api.new_key"></div><div class="codebox"><code class="key-value" id="newRouterKey"></code><button class="small" id="copyRouterKey" data-i18n="common.copy"></button></div><div class="muted" style="margin-top:7px" data-i18n="api.key_security"></div></div></div>
 </div></section>
</div>

<div class="tab-panel" id="logsTab" role="tabpanel" aria-labelledby="tabLogsBtn"><div class="panel-intro" data-i18n="logs.intro"></div><div class="log-toolbar"><div><b data-i18n="logs.events"></b> <span class="muted" id="logCount"></span></div><div class="row"><label class="switch"><input type="checkbox" id="logAutoScroll" checked> <span data-i18n="logs.autoscroll"></span></label><button class="danger" id="clearLogsBtn" data-i18n="logs.clear"></button></div></div><div class="log-window" id="logWindow"><div class="log-empty" id="logEmpty" data-i18n="logs.empty"></div></div></div>

<dialog id="providerDialog"><h3 data-i18n="dialog.add_provider"></h3><div class="grid"><label class="field"><span data-i18n="field.preset"></span><select id="preset"></select></label><label class="field"><span data-i18n="field.name"></span><input id="providerName" data-i18n-placeholder="field.provider_name_placeholder"></label><label class="field full"><span data-i18n="field.base_url"></span><input id="baseUrl" data-i18n-placeholder="field.base_url_placeholder"></label><label class="field full" id="apiKeyField"><span data-i18n="field.api_key"></span><input id="apiKey" type="password" data-i18n-placeholder="field.api_key_local_placeholder"></label><label class="field full" id="authPathField" hidden><span data-i18n="field.auth_path"></span><input id="authPath" data-i18n-placeholder="field.auth_path_placeholder"></label></div><div class="muted" id="presetNote" hidden style="margin-top:10px;font-size:13px"></div><div class="dialog-actions"><button data-close="providerDialog" data-i18n="common.cancel"></button><button class="primary" id="saveProvider" data-i18n="common.save"></button></div></dialog>
<dialog id="editModelDialog"><h3 data-i18n="dialog.edit_model"></h3><input type="hidden" id="editRouteId"><div class="grid"><label class="field full"><span data-i18n="field.provider"></span><select id="editRouteProvider"></select></label><label class="field full"><span data-i18n="field.model_id"></span><input id="editRouteModel"></label><label class="field full"><span data-i18n="field.label"></span><input id="editRouteLabel"></label></div><div class="muted" style="margin-top:10px;font-size:13px" data-i18n="field.label_hint"></div><div class="dialog-actions"><button data-close="editModelDialog" data-i18n="common.cancel"></button><button class="primary" id="saveEditModel" data-i18n="common.save"></button></div></dialog>
<dialog id="editProviderDialog"><h3 data-i18n="dialog.edit_provider"></h3><input type="hidden" id="editProviderId"><div class="grid"><label class="field"><span data-i18n="field.name"></span><input id="editProviderName"></label><label class="field"><span data-i18n="field.base_url"></span><input id="editProviderUrl"></label><label class="field full"><span data-i18n="field.api_key"></span><input id="editProviderKey" type="password" data-i18n-placeholder="field.keep_key_placeholder"></label></div><div class="row" style="margin-top:10px"><button class="small danger" id="clearProviderKey" data-i18n="provider.remove_saved_key"></button></div><div class="dialog-actions"><button data-close="editProviderDialog" data-i18n="common.cancel"></button><button class="primary" id="saveEditProvider" data-i18n="common.save"></button></div></dialog>
<dialog id="modelDialog"><h3 id="modelTitle" data-i18n="dialog.add_model"></h3><input type="hidden" id="modelProviderId"><div class="grid"><label class="field full"><span data-i18n="field.model_id"></span><input id="modelId" data-i18n-placeholder="field.model_example"></label><label class="field full"><span data-i18n="field.label_optional"></span><input id="modelLabel" data-i18n-placeholder="field.readable_name"></label></div><div class="row" style="margin-top:12px"><button id="discoverModels" data-i18n="models.fetch"></button><span class="muted" id="discoverStatus"></span></div><div id="discoverList" class="discover" hidden></div><div class="dialog-actions"><button data-close="modelDialog" data-i18n="common.cancel"></button><button class="primary" id="saveModel" data-i18n="common.add"></button></div></dialog>
<dialog id="presetDialog"><h3 id="presetTitle" data-i18n="dialog.new_preset"></h3><input type="hidden" id="presetId"><div class="grid"><label class="field full"><span data-i18n="field.preset_name"></span><input id="presetLabel" data-i18n-placeholder="field.preset_example"></label></div><div class="muted" style="margin-top:10px;font-size:13px" data-i18n="field.preset_hint"></div><div class="dialog-actions"><button data-close="presetDialog" data-i18n="common.cancel"></button><button class="primary" id="savePreset" data-i18n="common.save"></button></div></dialog>
<dialog id="memberDialog"><h3 data-i18n="dialog.add_model_preset"></h3><input type="hidden" id="memberPresetId"><div class="muted" style="margin-bottom:10px;font-size:13px" data-i18n="field.members_hint"></div><div class="picker" id="memberPicker"></div><div class="dialog-actions"><button data-close="memberDialog" data-i18n="common.close"></button></div></dialog>
<footer class="footer"><span data-i18n="footer.copyright"></span><span data-i18n="footer.version"></span></footer>

<script>
const I18N={};
let state=null,live=null,service=null,logCursor=0,logRowsCache=[];
const $=s=>document.querySelector(s);
const LANG_KEY='gisell-lang';
let lang=localStorage.getItem(LANG_KEY)==='en'?'en':'it';
async function ensureLanguage(code){if(I18N[code])return;const r=await fetch('/api/i18n/'+code);if(!r.ok)throw new Error(String(r.status));I18N[code]=await r.json()}
function t(key,vars={}){const pack=I18N[lang]||I18N.it||{};let s=pack[key]??I18N.it?.[key]??key;return String(s).replace(/\{([A-Za-z0-9_]+)\}/g,(_,k)=>vars[k]??'')}
function localize(root=document){document.documentElement.lang=lang;document.title=t('page.title');root.querySelectorAll?.('[data-i18n]').forEach(e=>e.textContent=t(e.dataset.i18n));root.querySelectorAll?.('[data-i18n-html]').forEach(e=>e.innerHTML=t(e.dataset.i18nHtml));for(const [attr,data] of [['title','i18nTitle'],['placeholder','i18nPlaceholder'],['aria-label','i18nAriaLabel']])root.querySelectorAll?.(`[data-${data.replace(/[A-Z]/g,m=>'-'+m.toLowerCase())}]`).forEach(e=>e.setAttribute(attr,t(e.dataset[data])));const b=$('#langBtn');if(b){b.textContent=t(lang==='it'?'lang.code_en':'lang.code_it');b.title=t(lang==='it'?'lang.switch_en':'lang.switch_it')}}
async function setLanguage(next){lang=next==='en'?'en':'it';await ensureLanguage(lang);localStorage.setItem(LANG_KEY,lang);localize();if(state)render();if(service)renderService();renderLogRows()}
function ask(key,vars={}){return window.confirm(t(key,vars))}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function flashKey(key,ok=true,vars={}){flashText(t(key,vars),ok)}
function flashText(msg,ok=true){const e=$('#flash');e.textContent=msg;e.className='flash '+(ok?'ok':'bad');const shown=e.textContent;setTimeout(()=>{if(e.textContent===shown)e.textContent=''},5000)}
async function api(url,opt={}){const headers={'Content-Type':'application/json','Accept-Language':lang,...(opt.headers||{})};const r=await fetch(url,{...opt,headers});let d;try{d=await r.json()}catch{d={detail:await r.text()}}if(!r.ok)throw new Error(typeof d.detail==='string'?d.detail:(d.error?.message||d.error||JSON.stringify(d)));return d}
function providerOf(id){return state.providers.find(p=>p.id===id)}
function switchTab(id){document.querySelectorAll('.tab-panel').forEach(p=>p.classList.toggle('active',p.id===id));document.querySelectorAll('.tab-btn').forEach(b=>{const on=b.dataset.tab===id;b.classList.toggle('active',on);b.setAttribute('aria-selected',on?'true':'false')});localStorage.setItem('gisell-tab',id)}
function duration(sec){sec=Math.max(0,Math.floor(sec||0));if(sec<60)return sec+' '+t('unit.s');const m=Math.floor(sec/60);if(m<60)return m+' '+t('unit.min');const h=Math.floor(m/60);if(h<24)return h+' '+t('unit.h')+' '+(m%60)+' '+t('unit.min');const d=Math.floor(h/24);return t('time.days',{count:d})+' '+(h%24)+' '+t('unit.h')}
function healthTag(route){const h=state.health[route.id]||{};if(h.status==='ok')return `<span class="tag ok">${esc(t('common.ok'))}${h.latency_ms?' · '+h.latency_ms+' '+t('unit.ms'):''}</span>`;if(h.status==='error')return '<span class="tag bad" title="'+esc(h.last_error||'')+'">'+esc(t('common.error'))+'</span>';return '<span class="tag">'+esc(t('common.not_tested'))+'</span>'}

function logTime(ts){try{return new Date((ts||0)*1000).toLocaleTimeString(lang==='en'?'en-GB':'it-IT',{hour12:false})}catch{return'--:--:--'}}
function logMessage(x){if(!x.message_key)return x.message||'';const params={...(x.message_params||{})};if(x.message_key==='log.new_request'&&params.mode)params.mode=t('log.mode.'+params.mode);return t(x.message_key,params)}

function renderLogRows(){const w=$('#logWindow');if(!w)return;const nearBottom=w.scrollHeight-w.scrollTop-w.clientHeight<80;const stick=$('#logAutoScroll')?.checked&&nearBottom;w.innerHTML='';if(!logRowsCache.length){w.innerHTML=`<div class="log-empty" id="logEmpty">${esc(t('logs.empty'))}</div>`;return}for(const x of logRowsCache){const source=[x.provider,x.label||x.model].filter(Boolean).join(' / ')||(x.request_id||x.kind||t('log.source_router'));const row=document.createElement('div');row.className='log-row';const msg=logMessage(x),detail=logDetail(x);const level=t('logs.level.'+(x.level||'info'));row.innerHTML=`<div class="log-time">${esc(logTime(x.at))}</div><div class="log-level ${esc(x.level||'info')}">${esc(level)}</div><div class="log-source" title="${esc(source)}">${esc(source)}</div><div class="log-message">${esc(msg)}${detail?`<span class="log-detail">${esc(detail)}</span>`:''}</div>`;w.appendChild(row)}if(stick)w.scrollTop=w.scrollHeight}

function ago(ts){if(!ts)return'';const d=Math.max(0,Date.now()/1000-ts);if(d<1)return t('time.now');if(d<60)return t('time.seconds_ago',{count:Math.round(d)});if(d<3600)return t('time.minutes_ago',{count:Math.round(d/60)});return t('time.hours_ago',{count:Math.round(d/3600)})}

document.body.addEventListener('click',async e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,id=b.dataset.id;try{if(a==='add-model'){const p=providerOf(id);$('#modelProviderId').value=id;$('#modelTitle').textContent=t('dialog.add_model_to',{provider:p.name});$('#modelId').value='';$('#modelLabel').value='';$('#discoverList').hidden=true;$('#discoverStatus').textContent='';$('#modelDialog').showModal();return}if(a==='preset-rename'){const g=presetOf(id);$('#presetTitle').textContent=t('dialog.rename_preset');$('#presetId').value=id;$('#presetLabel').value=g.label;$('#presetDialog').showModal();return}if(a==='preset-add'){$('#memberPresetId').value=id;renderMemberPicker();$('#memberDialog').showModal();return}if(a==='pm-add'||a==='pm-del'||a==='pm-up'||a==='pm-down'){const g=presetOf(id),mid=b.dataset.mid,m=[...(g.members||[])],i=m.indexOf(mid);if(a==='pm-add'&&i<0)m.push(mid);if(a==='pm-del'&&i>=0)m.splice(i,1);if(a==='pm-up'&&i>0)m[i-1]=m.splice(i,1,m[i-1])[0];if(a==='pm-down'&&i>=0&&i<m.length-1)m[i+1]=m.splice(i,1,m[i+1])[0];state=await savePresetMembers(id,m);render();if(a==='pm-add')renderMemberPicker();return}if(a==='edit-route'){const r=state.routes.find(x=>x.id===id);$('#editRouteId').value=id;$('#editRouteModel').value=r.model;$('#editRouteLabel').value=r.label;$('#editRouteProvider').innerHTML=state.providers.map(p=>`<option value="${p.id}"${p.id===r.provider_id?' selected':''}>${esc(p.name)}</option>`).join('');$('#editModelDialog').showModal();return}if(a==='edit-provider'){const p=providerOf(id);$('#editProviderId').value=id;$('#editProviderName').value=p.name;$('#editProviderUrl').value=p.base_url;$('#editProviderKey').value='';$('#editProviderKey').placeholder=t(p.has_api_key?'field.saved_key_keep_placeholder':'field.no_saved_key_placeholder');$('#editProviderDialog').showModal();return}if(a==='codex-check'){const el=document.querySelector(`[data-codex="${id}"]`);if(el)el.textContent=t('loading.checking');try{const d=await api(`/api/providers/${id}/codex-status`);if(el)el.textContent=d.ok?t('login.active',{account:d.account_id||'?',minutes:Math.max(0,Math.round((d.expires_in_s||0)/60))}):t('login.problem',{error:d.error});d.ok?flashKey('flash.codex_valid'):flashText(d.error,false)}catch(err){if(el)el.textContent=t('loading.check_failed');flashText(err.message,false)}return}if(a==='delete-provider'){if(!ask('confirm.delete_provider'))return;state=await api('/api/providers/'+id,{method:'DELETE'})}if(a==='toggle-provider'){const p=providerOf(id);state=await api('/api/providers/'+id,{method:'PATCH',body:JSON.stringify({enabled:!p.enabled})})}if(a==='delete-route'){const r=state.routes.find(x=>x.id===id);if(r?.kind==='preset'&&!ask('confirm.delete_preset'))return;state=await api('/api/routes/'+id,{method:'DELETE'})}if(a==='toggle-route'){const r=state.routes.find(x=>x.id===id);const url=(r.kind==='preset'?'/api/presets/':'/api/routes/')+id;state=await api(url,{method:'PATCH',body:JSON.stringify({enabled:!r.enabled})})}if(a==='up'||a==='down'){state=await api(`/api/routes/${id}/move`,{method:'POST',body:JSON.stringify({direction:a==='up'?-1:1})})}if(a==='activate'){state=await api(`/api/routes/${id}/activate`,{method:'POST'});flashKey('flash.active_set')}if(a==='test'){b.disabled=true;b.textContent=t('common.testing');const d=await api(`/api/routes/${id}/test`,{method:'POST'});state=d.state;d.ok?flashKey('flash.test_success',true,{ms:d.latency_ms}):flashText(d.error||t('flash.test_failed'),false)}render()}catch(err){flashText(err.message,false)}finally{if(a==='test'){b.disabled=false;b.textContent=t('common.test')}}});
$('#overrideChk').addEventListener('change',async e=>{try{state=await api('/api/settings',{method:'PATCH',body:JSON.stringify({override_client_model:e.target.checked})});flashKey(e.target.checked?'flash.force_on':'flash.force_off')}catch(err){flashText(err.message,false);e.target.checked=!e.target.checked}});
$('#saveEditModel').addEventListener('click',async()=>{try{state=await api('/api/routes/'+$('#editRouteId').value,{method:'PATCH',body:JSON.stringify({model:$('#editRouteModel').value,label:$('#editRouteLabel').value,provider_id:$('#editRouteProvider').value})});$('#editModelDialog').close();render();flashKey('flash.model_updated')}catch(e){flashText(e.message,false)}});
$('#saveEditProvider').addEventListener('click',async()=>{try{const b={name:$('#editProviderName').value,base_url:$('#editProviderUrl').value};const k=$('#editProviderKey').value;if(k)b.api_key=k;state=await api('/api/providers/'+$('#editProviderId').value,{method:'PATCH',body:JSON.stringify(b)});$('#editProviderDialog').close();render();flashKey('flash.provider_updated')}catch(e){flashText(e.message,false)}});
$('#clearProviderKey').addEventListener('click',async()=>{if(!ask('confirm.remove_provider_key'))return;try{state=await api('/api/providers/'+$('#editProviderId').value,{method:'PATCH',body:JSON.stringify({api_key:''})});$('#editProviderDialog').close();render();flashKey('flash.provider_key_removed')}catch(e){flashText(e.message,false)}});
async function boot(){await ensureLanguage('it');await ensureLanguage(lang);localize();$('#logCount').textContent=t('logs.rows',{count:0});await refresh();startPolling();refreshService()}
boot().catch(e=>flashText(e.message,false));
</script></main></body></html>
